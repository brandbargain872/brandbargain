<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Brand Bargain</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 320px;
      margin: 0 auto;
      text-align: center;
    }

    h2 {
      margin: 40px 0 20px;
    }

    .product-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .product-card img {
      width: 100%;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .price {
      font-weight: bold;
      font-size: 18px;
      margin: 10px 0 20px;
    }

    .btn {
      display: inline-block;
      background: #3b2f2f;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Our Products</h2>
  <p style="margin-bottom:30px;color:#555;">
  We offer authentic luxury items from premium brands,
  sourced through trusted partners and made more accessible.
</p>


  <div class="product-card">
    <img src="product1.jpg" alt="TRAPSTAR tracksuit">
    <h3>TRAPSTAR tracksuit</h3>
    <p class="price">€186</p>
    <a class="btn" href="#">Request details</a>
  </div>

</div>

</body>
</html>
